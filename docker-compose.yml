version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: capstone-backend
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
      - SIMULATED_DELAY_MS=${SIMULATED_DELAY_MS:-0}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: capstone-gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - BACKEND_URI=http://backend:8081
      - STATIC_REQUEST_LIMIT=${STATIC_REQUEST_LIMIT:-10}
    depends_on:
      backend:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: capstone-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - gateway
      - backend

  grafana:
    image: grafana/grafana:10.4.0
    container_name: capstone-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

networks:
  default:
    name: capstone-network
